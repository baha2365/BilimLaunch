<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Universities — BilimLaunch</title>
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#050608" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/apple.css" />
</head>
<body class="dash-page">
  <header class="dash-topbar">
    <span class="brand">Bilim<span class="brand__spark">Launch</span></span>
    <nav class="dash-nav">
      <a href="profile.html">Profile</a>
      <a href="universities.html" class="is-active">Universities</a>
    </nav>
    <div class="dash-topbar__right">
      <span class="dash-topbar__greeting" id="greeting"></span>
      <button type="button" class="btn btn-secondary btn-small" id="logoutBtn">Sign out</button>
    </div>
  </header>

  <main class="uni-main">
    <div class="uni-main__head">
      <h1>Universities</h1>
      <p>
        Tuition, entry requirements and scholarships — read straight from each university's own
        admissions pages. Open one to see the details.
      </p>
    </div>

    <div class="uni-search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="uniSearch" placeholder="Search universities, cities, countries" autocomplete="off" aria-label="Search universities" />
    </div>

    <div class="uni-grid" id="uniGrid">
      <p class="empty-note">Loading universities…</p>
    </div>
  </main>

  <script src="fx.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
  <script src="universities.js"></script>
</body>
</html>
