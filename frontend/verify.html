<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify your email — BilimLaunch</title>
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#050608" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/apple.css" />
</head>
<body class="auth-page">
  <header class="auth-topbar">
    <a class="brand" href="index.html" aria-label="BilimLaunch home">Bilim<span class="brand__spark">Launch</span></a>
  </header>

  <main class="auth-layout">
    <section class="auth-pitch">
      <p class="auth-pitch__eyebrow">Step 2 of 3 — confirm your email</p>
      <h1>Check <span class="grad">your inbox.</span></h1>
      <p class="auth-pitch__sub">
        If the address is right, a 6-digit code is on its way. It stays valid for 10 minutes.
      </p>
    </section>

    <section class="auth-card" id="verifyCard">
      <div class="success-badge" aria-live="polite">
        <div class="success-badge__ring"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
        <p>Email verified</p>
      </div>
      <h2>Enter your code</h2>
      <span class="auth-card__sub">Sent to <strong id="verifyEmail"></strong></span>

      <p class="auth-card__form-error" id="formError"></p>
      <p class="auth-card__notice" id="formNotice"></p>

      <form id="verifyForm" novalidate>
        <div class="field">
          <label for="code">Verification code</label>
          <div class="code-box" data-code-slots>
            <div class="code-slots" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
            <input type="text" id="code" name="code" class="code-input" inputmode="numeric" autocomplete="one-time-code" aria-label="6-digit verification code" />
          </div>
          <div class="code-actions">
            <button type="button" class="btn btn-secondary btn-small" id="pasteBtn">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
              Paste code
            </button>
            <span class="code-actions__hint" id="pasteHint">Copied it? Paste it here.</span>
          </div>
          <p class="field__error" id="code-error"></p>
        </div>

        <button type="submit" class="btn btn-primary">Verify email</button>
      </form>

      <p class="auth-card__foot">
        Didn't get it? Check your spam folder, or
        <button type="button" class="link-btn" id="resendBtn" disabled>Send a new code</button>
      </p>
      <p class="auth-card__foot" style="margin-top:10px;">
        <a href="register.html">Use a different email</a>
      </p>
    </section>
  </main>

  <script src="fx.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
